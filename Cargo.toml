[package]
name = "windit"
version = "0.0.0"
edition = "2021"
repository = "https://github.com/findit-studio/windit"
homepage = "https://github.com/findit-studio/windit"
documentation = "https://docs.rs/windit"
description = "Generic windowed-sequence processing: chunk, pad/mask, aggregate, smooth, segment — for embeddings, VAD, and ASR."
keywords = ["windowing", "embedding", "aggregation", "chunking", "vad"]
categories = ["algorithms", "no-std", "text-processing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.73"

[[bench]]
path = "benches/windit.rs"
name = "windit"
harness = false

[features]
default = ["alloc"]
alloc = ["dep:libm"]
std = ["alloc"]
text = ["alloc", "dep:unicode-segmentation"]
serde = ["dep:serde"]

[dependencies]
# `libm` supplies `sqrtf` for the L2 renormalization in `aggregate`, which core
# cannot provide (`f32::sqrt` is std-only). Pulled in with `alloc` because every
# sqrt use lives in the alloc-gated aggregation code.
libm = { version = "0.2", optional = true }
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", optional = true, default-features = false, features = [
  "alloc",
  "derive",
] }

[dev-dependencies]
criterion = "0.8"
# A serde data format for the round-trip tests. `alloc`-only (no `std`) so the
# tests exercise serde in the `no_std + alloc` configuration too.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(docsrs)',
  'cfg(tarpaulin)',
] }
