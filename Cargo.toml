[package]
name = "windit"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/findit-studio/windit"
homepage = "https://github.com/findit-studio/windit"
documentation = "https://docs.rs/windit"
description = "Generic windowed-sequence processing: chunk, pad/mask, aggregate, smooth, segment — for embeddings, VAD, and ASR."
keywords = ["windowing", "embedding", "aggregation", "chunking", "vad"]
categories = ["algorithms", "no-std", "text-processing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.95"
# Keep the published package to source, license, readme, and the acceptance
# suite; CI configuration is development-only.
exclude = [
  ".github/",
  "ci/",
  ".codecov.yml",
]

[[bench]]
path = "benches/windit.rs"
name = "windit"
harness = false

# Hierarchical, not independent: `std` implies `alloc`. The heap tier owns the
# sqrt dependency (`alloc = ["dep:libm"]`) because every sqrt call lives in the
# alloc-gated aggregation code, so a `std`-without-`alloc` build would compile
# that code with no `libm::sqrtf` to call. Decoupling to `std = []` would force
# `std` to either pull libm anyway or carry a second, std-only sqrt path — the
# duplicate implementation an independent feature model invites.
#
# Because `std` implies `alloc`, the crate's `any(feature = "std", feature =
# "alloc")` gates are today exactly equivalent to gating on `alloc` alone. They
# are spelled the long way deliberately, so they stay correct if this table is
# ever decoupled.
[features]
default = ["alloc"]
alloc = ["dep:libm"]
std = ["alloc"]
text = ["alloc", "dep:unicode-segmentation"]
serde = ["dep:serde"]

[dependencies]
# `libm` supplies `sqrtf` for the L2 renormalization in `aggregate`, which core
# cannot provide (`f32::sqrt` is std-only). Pulled in with `alloc` because every
# sqrt use lives in the alloc-gated aggregation code. Default features are kept
# (no `default-features = false`) deliberately: libm's only default feature is
# `arch` (architecture-specific intrinsics), and libm is `#![no_std]`
# unconditionally regardless of that feature, so the default is already
# no_std-safe — do not "fix" this.
libm = { version = "0.2", optional = true }
# Word and sentence boundaries for the `text` feature. Unbounded within 1.x: the
# newest release (1.13.3) declares `rust-version = 1.85`, well under this crate's
# 1.95 MSRV, so the version ceiling this dependency used to carry is obsolete.
# Default features are not disabled because there are none to disable: the
# crate's sole feature (`no_std`) is a legacy no-op and is not a default, and the
# crate is `no_std`-compatible as shipped — proven by CI's bare-metal
# `--features alloc,text` row.
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", optional = true, default-features = false, features = [
  "alloc",
  "derive",
] }

[dev-dependencies]
criterion = "0.8"
# A serde data format for the round-trip tests. `alloc`-only (no `std`) so the
# tests exercise serde in the `no_std + alloc` configuration too.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
