[package]
name = "windit"
version = "0.5.0"
edition = "2021"
repository = "https://github.com/findit-studio/windit"
homepage = "https://github.com/findit-studio/windit"
documentation = "https://docs.rs/windit"
description = "Generic windowed-sequence processing: chunk, pad/mask, aggregate, smooth, segment — for embeddings, VAD, and ASR."
keywords = ["windowing", "embedding", "aggregation", "chunking", "vad"]
categories = ["algorithms", "no-std", "text-processing"]
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.95"
# Keep the published package to source, license, readme, and the acceptance
# suite; CI configuration is development-only.
exclude = [
  ".github/",
  "ci/",
  ".codecov.yml",
]

[[bench]]
path = "benches/windit.rs"
name = "windit"
harness = false

# Hierarchical, not independent: `std` implies `alloc`. Decoupling to `std = []`
# would force `std` to either pull `alloc` in anyway or carry a second, std-only
# copy of every `Vec`-returning algorithm — the duplicate implementation an
# independent feature model invites.
#
# No feature owns the sqrt dependency. `Real::sqrt` is a method on the ungated
# `scalar` tier, so `libm` is an unconditional dependency rather than an `alloc`
# implication; see the note in `[dependencies]`.
#
# Because `std` implies `alloc`, the crate's `any(feature = "std", feature =
# "alloc")` gates are today exactly equivalent to gating on `alloc` alone. They
# are spelled the long way deliberately, so they stay correct if this table is
# ever decoupled.
[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
text = ["alloc", "dep:unicode-segmentation"]
serde = ["dep:serde"]
# f16 / bf16 storage scalars. Named for its dependency per the `serde` precedent,
# and deliberately does NOT imply `alloc`: the scalars are core-tier, so
# `--no-default-features --features half` is a valid trait-surface-plus-scalars
# build with no algorithms.
half = ["dep:half"]

[dependencies]
# `libm` supplies `sqrtf` / `sqrt` for `Real::sqrt`, which core cannot provide
# (`f32::sqrt` is std-only). Non-optional because `Real` lives in the ungated
# `scalar` module: a `--no-default-features` build gets the trait and so needs
# its implementation, and gating this behind `alloc` would leave the core tier
# with a sqrt it cannot call. libm is `#![no_std]` and pulls in nothing itself,
# so that tier pays only the code size of the sqrt it actually calls. Default
# features are kept (no `default-features = false`) deliberately: libm's only
# default feature is `arch` (architecture-specific intrinsics), which is both
# no_std-safe and what lowers `sqrtf` to the hardware square-root instruction,
# so the generic path costs nothing against std's `f32::sqrt` — do not "fix"
# this.
libm = "0.2"
# Word and sentence boundaries for the `text` feature. Unbounded within 1.x: the
# newest release (1.13.3) declares `rust-version = 1.85`, well under this crate's
# 1.95 MSRV, so the version ceiling this dependency used to carry is obsolete.
# Default features are not disabled because there are none to disable: the
# crate's sole feature (`no_std`) is a legacy no-op and is not a default, and the
# crate is `no_std`-compatible as shipped — proven by CI's bare-metal
# `--features alloc,text` row.
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", optional = true, default-features = false, features = [
  "alloc",
  "derive",
] }
# f16 / bf16 storage scalars for the `half` feature. `default-features = false`
# drops half's `std` default (its feature table is hierarchical like this
# crate's: `std = ["alloc"]`, `alloc = []`), so the bare-metal tier stays intact;
# on targets without native half-precision intrinsics the f64 conversions are
# pure-Rust core code. MSRV: half 2.7.1 declares rust-version 1.81, inside this
# crate's 1.95.
half = { version = "2", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.8"
# A serde data format for the round-trip tests. `alloc`-only (no `std`) so the
# tests exercise serde in the `no_std + alloc` configuration too.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The document format `TailPolicy` is actually configured through (a TOML
# options document, per the `mediagraph` node-options surface). `alloc`-only for
# the same reason as `serde_json` above.
toml = { version = "1", default-features = false, features = [
  "parse",
  "display",
  "serde",
] }
# A compact, non-self-describing format, for the half of `TailPolicy`'s wire
# split that no human-readable format can exercise. `alloc`-only (no `std`) for
# the same reason as `serde_json` above; postcard's `alloc` feature is what
# supplies `to_allocvec`.
postcard = { version = "1", default-features = false, features = ["alloc"] }
# A *self-describing* binary format: it reports `is_human_readable() == false`
# yet writes `TailPolicy`'s two fields by name, so it is the row that separates
# "not human-readable" from "not self-describing" — the distinction the wire
# split turns on. `default-features = false` drops its `std` default, matching
# the dev-dependencies above.
ciborium = { version = "0.2", default-features = false }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
