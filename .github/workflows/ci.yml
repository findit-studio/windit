name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    # `--all-targets` so tests, benches and the integration suites are linted too.
    # Without it this job lints the library alone: every other target is compiled
    # somewhere in CI but never linted, so a lint regression can land in
    # `tests/`, `src/**/tests.rs` or `benches/windit.rs` unseen.
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --all-targets

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # Prove the crate's headline `no_std` claim against a target that genuinely
  # lacks `std` — unlike the `cross` job above, whose targets (e.g.
  # riscv64gc-unknown-linux-gnu) all have std and so would let a `std` leak
  # into the alloc-only tier pass unnoticed. `cargo check` is enough: there is
  # no linker for a bare-metal target without extra setup, and this job exists
  # to catch a `std` leak in the type/trait surface, not to link a binary.
  no-std:
    name: no-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-no-std-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-no-std-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install bare-metal target (thumbv7em-none-eabihf)
        run: rustup target add thumbv7em-none-eabihf
      - name: cargo check --target thumbv7em-none-eabihf --no-default-features
        run: cargo check --target thumbv7em-none-eabihf --no-default-features
      - name: cargo check --target thumbv7em-none-eabihf --features alloc
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,text
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,text
      - name: cargo check --target thumbv7em-none-eabihf --features serde
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features serde
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,text,serde
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,text,serde
      # `half` must build bare-metal without `alloc` (it does not imply alloc):
      # the core-tier scalar surface, no algorithms.
      - name: cargo check --target thumbv7em-none-eabihf --features half
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features half
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,half
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,half

  # Prove rustdoc is warning-clean on every feature row, not just under
  # `--all-features`. A doc comment can carry an intra-doc link to an item that
  # is only compiled under a feature the reader didn't enable; `--all-features`
  # alone can never catch that, since every item is present there. `--each-
  # feature` (cargo-hack) covers `--no-default-features` too, which is exactly
  # the row an `--all-features`-only check would miss.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo hack doc --each-feature
        run: cargo hack doc --each-feature --no-deps
      - name: cargo doc --all-features
        run: cargo doc --all-features --no-deps
      # Building rustdoc is not running it. `src/lib.rs` includes `README.md` as
      # the crate documentation on every `alloc`/`std` row, so the front page's
      # worked examples ARE doctests: a Markdown-only edit can replace one with a
      # call to an item that does not exist, and only executing them catches it.
      # Both rows the README is included on are covered — `--all-features` and the
      # bare default — because the two differ in which items the examples may name.
      - name: cargo test --doc --all-features
        run: cargo test --doc --all-features
      - name: cargo test --doc (default features)
        run: cargo test --doc
      # The doctests above only protect the README while this workflow still runs
      # on a README-only change. `paths-ignore: '**.md'` used to silence every job
      # here for exactly that change — the hole this step keeps closed. It runs on
      # any code change, so a re-added ignore is caught on the next commit even
      # though the ignored commit itself would not have run it.
      - name: The README is crate documentation, so Markdown must not skip CI
        run: |
          set -euo pipefail
          if grep -nE "^\s*-\s*'?\*\*\.md'?\s*$" .github/workflows/ci.yml; then
            echo "::error file=.github/workflows/ci.yml::'**.md' is back in paths-ignore. src/lib.rs includes README.md as crate documentation, so its examples are doctests and a Markdown-only change must run this workflow." >&2
            exit 1
          fi

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset
    # `cargo hack build --feature-powerset` covers the library on every feature
    # row but compiles no test or bench target, and the `test` job's `cargo hack
    # test --feature-powerset` compiles the test targets but not the benches —
    # so nothing above ever builds `benches/windit.rs`, and nothing builds every
    # target at once on the crate's DEFAULT row. That row is the one where
    # `alloc` is aliased as `std`, so an import of a module only real `std` has
    # (`cell`, `sync`, `collections::HashMap`, ...) inside a test target fails
    # there while passing under `--all-features`. `--no-run` because executing
    # the tests is the `test` job's business; this row exists to compile.
    - name: Compile every target under default features
      run: cargo test --no-run --all-targets

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  # No `unsafe` in this crate's src/, so miri (tree-borrows and stacked-
  # borrows) has nothing to check — and it cannot run regardless: the
  # required `libm` dependency's `Real::sqrt` reaches a hardware-sqrt
  # `core::arch::asm!` (libm-0.2.16 src/math/arch/x86.rs), which miri's
  # interpreter cannot execute. Reinstate a targeted miri job (e.g. `libm`
  # built for soft-floats, no asm) if `unsafe` is ever introduced.

  # Prove the declared `rust-version` (Cargo.toml) genuinely builds, per feature
  # row, so a dependency upgrade or a newer-than-MSRV language or library feature
  # cannot regress the floor silently. Warnings are not denied here: lints evolve
  # across toolchains, so MSRV is about buildability only.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features alloc"
          - "--no-default-features --features std"
          - "--no-default-features --features text"
          - "--no-default-features --features serde"
          - "--all-features"
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal && rustup default 1.95
      - name: cargo build ${{ matrix.features }}
        run: cargo build ${{ matrix.features }}

  # valgrind:
  #   name: valgrind
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Cache cargo build and registry
  #       uses: actions/cache@v6
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ubuntu-latest-valgrind-
  #     - name: Install Rust
  #       run: rustup update stable && rustup default stable
  #     - name: Install Valgrind
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y valgrind
  #     # Uncomment and customize when you have binaries to test:
  #     # - name: cargo build foo
  #     #   run: cargo build --bin foo
  #     #   working-directory: integration
  #     # - name: Run valgrind foo
  #     #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
  #     #   working-directory: integration

  # Prove that the *tarball* is testable, before it is published. Every other job
  # here builds the working tree; none of them builds the tarball, whose contents
  # are decided by `exclude` in Cargo.toml. A file the acceptance suite needs and
  # `exclude` drops leaves the published crate broken for every consumer while CI
  # stays green — which is precisely the class of failure that only shows up
  # after `cargo publish`.
  #
  # That is the whole of what this job establishes, and the rest of this comment
  # is the half that matters: what a green here does **not** mean. It says
  # nothing about whether the version in Cargo.toml can actually be published.
  # `cargo publish --dry-run` used to run as the last step as though it did, and
  # was removed after measuring that it cannot fail for that — or for anything
  # else the `cargo package` step above does not already catch:
  #
  #   version already on crates.io   exit 0, with only `warning: crate
  #                                  windit@0.2.0 already exists on crates.io
  #                                  index` to show for it
  #   no description, no license     exit 0 — from the dry run *and* from
  #                                  `cargo package`; both merely warn
  #
  # (`RUSTFLAGS: -Dwarnings` does not reach either: those are Cargo's warnings,
  # not rustc's.) It does not validate `keywords` or `categories` either — the
  # registry rejects those only on a real publish. So its one distinguishing act
  # was a second verification build of the same tarball.
  #
  # Publishing is a deliberate manual step; there is no release workflow. The
  # version bump, the changelog entry and the registry's metadata rules are a
  # human's responsibility at publish time. Nothing in CI gates them, and no job
  # here should be read as claiming otherwise.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      # Builds the tarball and compiles it from its own contents.
      - name: cargo package
        run: cargo package
      # Compiling the package is not exercising it: unpack the tarball and run
      # the acceptance suite from inside it, over the feature rows, so the
      # published source is proven to pass the same tests the repository does.
      #
      # Unpacked *outside* the checkout, and that is not a preference. Cargo.toml
      # carries `[workspace.lints]`, which makes the repository root an implicit
      # workspace root; anything under it that is not a member is refused. Under
      # `target/unpacked` the very first cargo invocation died with `current
      # package believes it's in a workspace when it's not` — before a single
      # test ran, so this job reported red without ever exercising the tarball it
      # exists to exercise. `$RUNNER_TEMP` is outside `$GITHUB_WORKSPACE`, so the
      # unpacked crate is the standalone package a consumer would get.
      - name: Test the unpacked package across the feature rows
        run: |
          set -euo pipefail
          unpacked="${RUNNER_TEMP}/unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf target/package/*.crate -C "$unpacked"
          cd "$unpacked"/*/
          cargo hack test --each-feature

  # Execute the benchmarks. Criterion's `--test` runs every benchmark once
  # without measuring, which is what makes the equivalence claims in
  # `benches/windit.rs` enforceable: each comparable arm asserts its output
  # against its partner arm outside the timed loop, so a pair that stops
  # measuring the same work fails this job instead of quietly reporting two
  # numbers about different computations.
  #
  # Deliberately a correctness gate and nothing else. No timing threshold is
  # asserted anywhere here — a shared CI runner cannot support one, and mixing a
  # machine-dependent performance bound into a parity gate would make both
  # useless.
  bench-parity:
    name: bench parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo bench --bench windit -- --test
        run: cargo bench --bench windit -- --test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
      - msrv
      - package
      - bench-parity
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --engine llvm --all-features --run-types lib --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
