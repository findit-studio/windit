name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # Prove the crate's headline `no_std` claim against a target that genuinely
  # lacks `std` — unlike the `cross` job above, whose targets (e.g.
  # riscv64gc-unknown-linux-gnu) all have std and so would let a `std` leak
  # into the alloc-only tier pass unnoticed. `cargo check` is enough: there is
  # no linker for a bare-metal target without extra setup, and this job exists
  # to catch a `std` leak in the type/trait surface, not to link a binary.
  no-std:
    name: no-std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-no-std-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-no-std-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install bare-metal target (thumbv7em-none-eabihf)
        run: rustup target add thumbv7em-none-eabihf
      - name: cargo check --target thumbv7em-none-eabihf --no-default-features
        run: cargo check --target thumbv7em-none-eabihf --no-default-features
      - name: cargo check --target thumbv7em-none-eabihf --features alloc
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,text
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,text
      - name: cargo check --target thumbv7em-none-eabihf --features serde
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features serde
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,text,serde
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,text,serde
      # `half` must build bare-metal without `alloc` (it does not imply alloc):
      # the core-tier scalar surface, no algorithms.
      - name: cargo check --target thumbv7em-none-eabihf --features half
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features half
      - name: cargo check --target thumbv7em-none-eabihf --features alloc,half
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features alloc,half

  # Prove rustdoc is warning-clean on every feature row, not just under
  # `--all-features`. A doc comment can carry an intra-doc link to an item that
  # is only compiled under a feature the reader didn't enable; `--all-features`
  # alone can never catch that, since every item is present there. `--each-
  # feature` (cargo-hack) covers `--no-default-features` too, which is exactly
  # the row an `--all-features`-only check would miss.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo hack doc --each-feature
        run: cargo hack doc --each-feature --no-deps
      - name: cargo doc --all-features
        run: cargo doc --all-features --no-deps

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset
    # `cargo hack build --feature-powerset` covers the library on every feature
    # row but compiles no test or bench target, and the `test` job's `cargo hack
    # test --feature-powerset` compiles the test targets but not the benches —
    # so nothing above ever builds `benches/windit.rs`, and nothing builds every
    # target at once on the crate's DEFAULT row. That row is the one where
    # `alloc` is aliased as `std`, so an import of a module only real `std` has
    # (`cell`, `sync`, `collections::HashMap`, ...) inside a test target fails
    # there while passing under `--all-features`. `--no-run` because executing
    # the tests is the `test` job's business; this row exists to compile.
    - name: Compile every target under default features
      run: cargo test --no-run --all-targets

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test --feature-powerset

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  # No `unsafe` in this crate's src/, so miri (tree-borrows and stacked-
  # borrows) has nothing to check — and it cannot run regardless: the
  # required `libm` dependency's `Real::sqrt` reaches a hardware-sqrt
  # `core::arch::asm!` (libm-0.2.16 src/math/arch/x86.rs), which miri's
  # interpreter cannot execute. Reinstate a targeted miri job (e.g. `libm`
  # built for soft-floats, no asm) if `unsafe` is ever introduced.

  # Prove the declared `rust-version` (Cargo.toml) genuinely builds, per feature
  # row, so a dependency upgrade or a newer-than-MSRV language or library feature
  # cannot regress the floor silently. Warnings are not denied here: lints evolve
  # across toolchains, so MSRV is about buildability only.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features alloc"
          - "--no-default-features --features std"
          - "--no-default-features --features text"
          - "--no-default-features --features serde"
          - "--all-features"
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal && rustup default 1.95
      - name: cargo build ${{ matrix.features }}
        run: cargo build ${{ matrix.features }}

  # valgrind:
  #   name: valgrind
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Cache cargo build and registry
  #       uses: actions/cache@v6
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ubuntu-latest-valgrind-
  #     - name: Install Rust
  #       run: rustup update stable && rustup default stable
  #     - name: Install Valgrind
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y valgrind
  #     # Uncomment and customize when you have binaries to test:
  #     # - name: cargo build foo
  #     #   run: cargo build --bin foo
  #     #   working-directory: integration
  #     # - name: Run valgrind foo
  #     #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
  #     #   working-directory: integration

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
      - msrv
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --engine llvm --all-features --run-types lib --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
