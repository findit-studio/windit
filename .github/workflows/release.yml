# Publishing windit, in the order that keeps the release traceable.
#
# The tag is the trigger, so an immutable `vX.Y.Z` pointing at the exact commit
# exists in the repository *before* the crate reaches crates.io — never after,
# and never not at all. 0.1.0 through 0.2.0 were published without one, which
# left the crates.io tarball as the only record of what was shipped; the
# `.cargo_vcs_info.json` inside it named a commit the repository did not mark.
#
# The gates below run against the tagged tree, so a tag whose version, changelog
# entry, or package contents disagree with it fails before anything is published.
# Publication is irreversible (a crates.io version cannot be replaced), which is
# why every check here runs first and `cargo publish` is the last step.
#
# To release: bump `version` in Cargo.toml, fold everything under `## Unreleased`
# into a `## X.Y.Z` section in CHANGELOG.md — the check below only requires that
# section to exist, and the release notes are read from it, so anything left in
# `Unreleased` ships unannounced — merge, then
# `git tag -a vX.Y.Z -m 'windit X.Y.Z' && git push origin vX.Y.Z`.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

# `contents: write` to create the GitHub Release; nothing else is needed.
permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack

      # A tag that does not name the version it points at is worse than no tag:
      # it is a wrong record. Fail before publishing, not after.
      - name: The tag, Cargo.toml and CHANGELOG.md must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $MANIFEST" >&2
            exit 1
          fi
          if ! grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## $TAG' section — the release notes are the reviewed changelog entry, so it has to exist" >&2
            exit 1
          fi

      # The same package verification the `package` job in ci.yml runs, repeated
      # here against the tagged tree: CI green on a branch is not evidence about
      # the commit the tag names.
      - name: cargo package
        run: cargo package
      - name: Test the unpacked package across the feature rows
        run: |
          set -euo pipefail
          mkdir -p target/unpacked
          tar -xzf target/package/*.crate -C target/unpacked
          cd target/unpacked/*/
          cargo hack test --each-feature

      # The reviewed changelog section becomes the release body, so the GitHub
      # Release and the repository cannot describe the version differently.
      - name: Create the GitHub Release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          python3 - "$TAG" > release-notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          body = open("CHANGELOG.md", encoding="utf-8").read()
          start = re.search(rf"^## {re.escape(version)}( |$).*?$", body, re.M)
          rest = body[start.end():]
          end = re.search(r"^## ", rest, re.M)
          sys.stdout.write((rest[: end.start()] if end else rest).strip() + "\n")
          PY
          gh release create "$GITHUB_REF_NAME" \
            --title "windit $TAG" \
            --notes-file release-notes.md \
            --verify-tag

      # Last, because it is the only step that cannot be undone.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
